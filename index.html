<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061426">
<title>EXION</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#06101f;color:#eef7ff}body{overflow:hidden}.app{height:100%;display:flex;flex-direction:column;background:radial-gradient(circle at 50% -10%,#12345c 0,#06101f 42%,#040a13 100%)}header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #17304b;background:rgba(4,13,25,.82);backdrop-filter:blur(14px)}.brand{display:flex;align-items:center;gap:10px;font-weight:800}.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#0b67ff,#20d9ff);box-shadow:0 0 22px #0ba9ff55}.top-actions{display:flex;gap:8px}.icon-btn,.voice-tab{border:1px solid #234665;background:#0b1b30;color:#dff6ff;border-radius:12px;padding:9px 12px;font-weight:700;cursor:pointer}.voice-tab{background:linear-gradient(135deg,#087cff,#12c9e9);border:0}.status{font-size:12px;color:#8fa9bd;padding:7px 14px;text-align:center}.main{flex:1;overflow:auto;padding:20px 14px 110px}.welcome{text-align:center;max-width:600px;margin:8vh auto 20px;color:#a9bed0}.welcome h1{color:#fff}.messages{max-width:760px;margin:auto}.message{display:flex;margin:10px 0}.message.user{justify-content:flex-end}.bubble{max-width:min(86%,680px);padding:12px 15px;border-radius:18px;background:#0c1d31;border:1px solid #1b3853;line-height:1.45;white-space:pre-wrap}.message.user .bubble{background:#096dce;border-color:#138be8}.composer{position:fixed;bottom:0;left:0;right:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#040a13 22%)}.composer-inner{max-width:760px;margin:auto;display:flex;gap:7px;align-items:end;background:#0a192b;border:1px solid #1d3a55;border-radius:18px;padding:8px}.composer textarea{flex:1;resize:none;max-height:120px;min-height:42px;border:0;outline:0;background:transparent;color:#fff;padding:11px;font:inherit}.round{width:42px;height:42px;border:0;border-radius:50%;background:#12304a;color:#fff;cursor:pointer}.send{background:#0c9fe8}.voice-call-btn{background:linear-gradient(135deg,#087cff,#12c9e9);box-shadow:0 0 16px rgba(18,201,233,.35);position:relative}.voice-call-btn:after{content:"Voz";position:absolute;right:-2px;bottom:-7px;font-size:8px;line-height:12px;padding:0 4px;border-radius:6px;background:#071b31;color:#bfefff;border:1px solid #24506b}.chips{display:flex;gap:7px;overflow:auto;padding:8px 0}.chip{border:1px solid #21445f;background:#0b1b2e;color:#a9c8db;border-radius:999px;padding:7px 10px;white-space:nowrap}.drawer{position:fixed;inset:0;z-index:80;display:none}.drawer.open{display:block}.drawer-panel{position:absolute;right:0;top:0;bottom:0;width:min(350px,92vw);background:#071524;border-left:1px solid #23435e;padding:20px;overflow:auto}.drawer-backdrop{position:absolute;inset:0;background:#0009}.drawer input{width:100%;padding:11px;background:#091c30;border:1px solid #24445e;color:#fff;border-radius:10px;margin:6px 0 10px}.typing{display:flex;gap:4px}.dot{width:7px;height:7px;border-radius:50%;background:#65dfff;animation:blink 1s infinite}.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}@keyframes blink{50%{opacity:.2}}.toast{position:fixed;left:50%;bottom:85px;transform:translateX(-50%);z-index:300;background:#10273e;color:#fff;border:1px solid #2b506d;border-radius:12px;padding:10px 14px;box-shadow:0 10px 30px #0008}.error .bubble{border-color:#8b3340}
</style>
</head>
<body>
<div class="app">
<header><div class="brand"><div class="logo"><img src="./assets/exion-icon.png" alt="EXION" style="width:38px;height:38px;border-radius:12px;object-fit:cover"></div><span>EXION</span></div><div class="top-actions"><button class="icon-btn" id="menuBtn">☰</button></div></header>
<div id="status" class="status">Conectando ao EXION…</div>
<main id="main" class="main"><section id="welcome" class="welcome"><h1>Olá, eu sou a EXION.</h1><p>Converse comigo, envie imagens ou toque em <b>📞</b> ao lado do microfone para entrar no EXION Voz em tempo real.</p></section><div id="messages" class="messages"></div></main>
<div class="composer"><div class="chips"><button class="chip" data-p="Explique isso de forma simples">Explicar</button><button class="chip" data-p="Pesquise isso na internet">Pesquisar</button><button class="chip" data-p="Me ajude a criar um projeto">Criar projeto</button></div><div class="composer-inner"><button class="round" id="attachBtn">📎</button><textarea id="input" placeholder="Fale com a EXION…" rows="1"></textarea><button class="round" id="micBtn">🎙️</button><button class="round voice-call-btn" id="callVoiceBtn" title="Abrir EXION Voz em tempo real" aria-label="Abrir EXION Voz em tempo real">📞</button><button class="round send" id="sendBtn">➤</button></div><input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp" hidden></div>
</div>
<aside id="drawer" class="drawer" aria-hidden="true"><div id="drawerBackdrop" class="drawer-backdrop"></div><div class="drawer-panel"><button id="closeMenu" class="icon-btn">Fechar</button><h2>Configurações</h2><label>Modo</label><select id="mode" style="width:100%;padding:10px;background:#091c30;color:#fff;border:1px solid #24445e;border-radius:10px"><option>Inteligente</option><option>Rápido</option><option>Criativo</option></select><p id="backendInfo" style="color:#9bb2c5">Verificando backend…</p><button id="refreshBackend" class="icon-btn">Atualizar conexão</button><div id="accessSetting" style="margin-top:20px"><label>Senha do backend</label><input id="appPassword" type="password"><button id="saveAccess" class="icon-btn">Salvar</button><button id="clearAccess" class="icon-btn">Limpar</button></div><hr style="border-color:#17304b;margin:20px 0"><button id="testVoice" class="voice-tab">🔊 Testar voz</button><button id="newBtn" class="icon-btn">Nova conversa</button><button id="clearBtn" class="icon-btn">Apagar conversa local</button></div></aside>
<script src="./app.js"></script>
</body>
</html>
