services:
  - type: web
    name: exion-ai
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: HOST
        value: 0.0.0.0
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-4-argon
      - key: GEMINI_LIVE_ENABLED
        value: true
      - key: GEMINI_LIVE_MODEL
        value: gemini-3.8-live
      - key: GEMINI_LIVE_VOICE
        value: Orus
      - key: GEMINI_ENABLE_SEARCH
        value: true
      - key: GEMINI_ENABLE_URL_CONTEXT
        value: true
      - key: GEMINI_ENABLE_CODE_EXECUTION
        value: false
      - key: GEMINI_STRUCTURED_OUTPUT
        value: false
      - key: EXION_ACCESS_PASSWORD
        generateValue: true
